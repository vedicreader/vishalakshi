name: CI
on:  [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: answerdotai/workflows/nbdev3-ci@master
        with:
          # a test worker that dies in native code prints its stack instead of only BrokenProcessPool
          setup: "export PYTHONFAULTHANDLER=1; grep -m1 'model name' /proc/cpuinfo"

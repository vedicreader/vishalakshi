name: debug-ci
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q --upgrade pip && pip install -q -e ".[dev]" nbdev
      - name: parallel on a cold model cache, then warmed
        run: |
          export PYTHONFAULTHANDLER=1
          for i in 1 2 3 4; do export HF_HOME=/tmp/hfcold$i; nbdev-test --flags '' > /tmp/p.txt 2>&1; echo "== cold run $i rc=$?"; grep -E 'Fatal Python|Bus error|Segmentation|Aborted|BrokenProcess' /tmp/p.txt | head -5; grep -A14 'Fatal Python' /tmp/p.txt | grep 'File "' | head -14; done
          for i in 1 2 3 4; do export HF_HOME=/tmp/hfwarm$i; python -c "from vishalakshi import Vault; Vault(':memory:'); Vault(':memory:', encoder='code')"; nbdev-test --flags '' > /tmp/p.txt 2>&1; echo "== warmed run $i rc=$?"; grep -E 'Fatal Python|BrokenProcess' /tmp/p.txt | head -3; done

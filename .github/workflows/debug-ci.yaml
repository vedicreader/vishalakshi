name: debug-ci
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: install exactly as nbdev3-ci does
        run: |
          python -m pip install -q --upgrade pip
          pip install -Uq "nbdev>=3.3.21"
          pip install -q -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
          pip freeze > /tmp/freeze.txt; grep -iE "numpy|torch|onnx|litert|usearch|model2vec|tokenizers|safetensors|scipy" /tmp/freeze.txt
      - name: parallel as CI, six times
        env: {OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES', PYTHONFAULTHANDLER: '1'}
        run: |
          for i in 1 2 3 4 5 6; do nbdev-test --flags '' > /tmp/p$i.txt 2>&1; echo "== run $i rc=$?"; grep -E 'Fatal Python|Bus error|Segmentation|Aborted|Illegal|BrokenProcess' /tmp/p$i.txt | head -5; grep -B2 -A25 'Fatal Python' /tmp/p$i.txt | grep -vE '^(W0000|I0000|INFO|WARNING)' | head -40; done

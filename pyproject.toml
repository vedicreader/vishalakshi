[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vishalakshi"
dynamic = ["version"]
description = "one vault for everything you read: web, papers, video, files and code, searchable together and answerable by a local or hosted model"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev', 'rag', 'research', 'memory', 'semantic search', 'knowledge base',
            'document classification', 'information extraction', 'structured output', 'ner']
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litesearch[sanskrit]>=0.1.25",
    "fossick>=0.1.7",
    "fastcore>=1.12.31",
    "numpy>=1.26",
    "mcp",
    "koshas>=0.0.36",
    "rgapi",
    "rishi[litert,remote]>=0.1.2",
    "pyskills>=0.0.27",
]

[project.optional-dependencies]
test = ["diskcache"]

[project.scripts]
vishalakshi = "vishalakshi.cli:main"
vishalakshi-mcp = "vishalakshi.mcp:main"

[project.entry-points.pyskills]
vishalakshi = "vishalakshi.skill"

[project.urls]
Repository = "https://github.com/vedicreader/vishalakshi"
Documentation = "https://vedicreader.github.io/vishalakshi/"

[project.entry-points.nbdev]
vishalakshi = "vishalakshi._modidx:d"

[tool.nbdev]

[tool.hatch.build.targets.wheel]
packages = ["vishalakshi"]

[tool.hatch.build.targets.sdist]
include = ["/vishalakshi", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "vishalakshi/__init__.py"

[dependency-groups]
dev = [
    "diskcache>=5.6.3",
    "ipykernel>=7.3.0",
    "nbdev>=3.3.4",
    "notebook>=7.6.1",
    "rishi[all]>=0.1.2",
]

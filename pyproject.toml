[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vishalakshi"
dynamic = ["version"]
description = "one vault for everything you read: web, papers, video, files and code, searchable together and answerable by a local or hosted model"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev', 'rag', 'research', 'memory', 'semantic search', 'knowledge base',
            'document classification', 'information extraction', 'structured output', 'ner']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "litesearch>=0.1.0",
    "fossick>=0.1.0",
    "fastcore>=1.12.31",
    "numpy>=1.26",
    "mcp",
    "koshas",
    "rgapi",
    "rishi",
]

[project.scripts]
vishalakshi = "vishalakshi.cli:main"
vishalakshi-mcp = "vishalakshi.mcp:main"

[project.urls]
Repository = "https://github.com/vedicreader/vishalakshi"
Documentation = "https://vedicreader.github.io/vishalakshi/"

[project.entry-points.nbdev]
vishalakshi = "vishalakshi._modidx:d"

[tool.nbdev]

[tool.hatch.build.targets.wheel]
packages = ["vishalakshi"]

[tool.hatch.build.targets.sdist]
include = ["/vishalakshi", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "vishalakshi/__init__.py"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbdev>=3.3.4",
    "notebook>=7.6.1",
]
